name: ReceiptScanner
options:
  bundleIdPrefix: com.kntl88
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ReceiptScanner:
    type: application
    platform: iOS
    sources:
      - ReceiptScanner
      - Shared
    dependencies:
      - target: ReceiptControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kntl88.ReceiptScanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Receipts
        INFOPLIST_KEY_NSCameraUsageDescription: The camera is used to scan receipts.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9CHRAUFN7Z
  ReceiptControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ReceiptControls
      - Shared
    info:
      path: ReceiptControls/Info.plist
      properties:
        CFBundleDisplayName: Receipts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kntl88.ReceiptScanner.Controls
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9CHRAUFN7Z
