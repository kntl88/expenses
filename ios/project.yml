name: ReceiptScanner
options:
  bundleIdPrefix: com.kntl88
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ReceiptScanner:
    type: application
    platform: iOS
    sources:
      - ReceiptScanner
      - Shared
    info:
      path: ReceiptScanner/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.kntl88.ReceiptScanner
            CFBundleURLSchemes: [receipts]
    entitlements:
      path: ReceiptScanner/ReceiptScanner.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kntl88.ReceiptScanner]
    dependencies:
      - target: ReceiptControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kntl88.ReceiptScanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Receipts
        INFOPLIST_KEY_NSCameraUsageDescription: The camera is used to scan receipts.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9CHRAUFN7Z
  ReceiptControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ReceiptControls
      - Shared
      # Foundation-only model code the Consumption widget reuses.
      - ReceiptScanner/WeekSummary.swift
      - ReceiptScanner/JSONValue.swift
      - ReceiptScanner/Models.swift
      - ReceiptScanner/WeekSummaryStyle.swift
    entitlements:
      path: ReceiptControls/ReceiptControls.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kntl88.ReceiptScanner]
    info:
      path: ReceiptControls/Info.plist
      properties:
        CFBundleDisplayName: Receipts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kntl88.ReceiptScanner.Controls
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9CHRAUFN7Z
schemes:
  # Only the app gets a scheme; the widget extension is embedded in it (running the extension's
  # own scheme makes Xcode try to show the widget on SpringBoard, which fails).
  ReceiptScanner:
    build:
      targets:
        ReceiptScanner: all
    run:
      config: Debug
    archive:
      config: Release
